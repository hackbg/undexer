---
kind: pipeline
type: docker
name: build
trigger: { event: [ push ] }
volumes: [ { name: docker, host: { path: "/data/ci-cache-docker" } } ]
image_pull_secrets: [ oci_hack_bg ] # https://docs.drone.io/pipeline/docker/syntax/images/#pulling-private-images
steps:
- name: build
  image: oci.hack.bg/platform-root-alpine:latest
  pull: always
  privileged: true
  environment:
    OCI_HOST: "oci.hack.bg"
    OCI_NAME: "undexer"
    OCI_USER: { from_secret: "oci-user" }
    OCI_PASS: { from_secret: "oci-pass" }
  commands:
  - echo $HOME
  - ls -al $HOME
  - git config --global --add safe.directory /drone/src
  - printf $(git rev-parse --abbrev-ref HEAD) > "$HOME/BRANCH"
  - cat "$HOME/BRANCH"
  - git submodule update --init --recursive --depth 1
  - ./build.sh debian
